name: WispIOS
options:
  minimumXcodeGenVersion: 2.44.0
  projectFormat: xcode16_0
  createIntermediateGroups: false
  deploymentTarget:
    iOS: '17.0'
packages:
  WispLocal:
    path: ..
fileGroups:
  - Config
  - README.md
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WispIOS:
    type: application
    productName: Wisp
    platform: iOS
    deploymentTarget: '17.0'
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Sources/WispIOS
        type: syncedFolder
      - path: Resources
        type: group
        buildPhase: resources
    dependencies:
      - package: WispLocal
        product: WispCore
    settings:
      base:
        PRODUCT_NAME: Wisp
        PRODUCT_BUNDLE_IDENTIFIER: com.briggskellogg.wisp.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '1.2.4'
        CURRENT_PROJECT_VERSION: '8'
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
schemes:
  WispIOS:
    build:
      targets:
        WispIOS: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
